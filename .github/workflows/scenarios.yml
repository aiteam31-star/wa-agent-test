name: Scenarios

# Runs the demo bot's chat scenarios and compares them with the committed baseline
# (baselines/demo-bot.json). The job FAILS if any scenario is newly broken.
#
# It uses the fake brain and the fake judge: no Ollama and no API keys are needed in CI.

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write # lets the job post its summary as a comment on a pull request

concurrency:
  group: scenarios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true # a newer push replaces a run that is still going

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: pip install -e .

      # Starts the mock Graph API and the demo bot (fake brain), runs every scenario with the
      # fake judge, and compares with baselines/demo-bot.json. Exits 1 if anything is newly broken.
      - name: Run all scenarios and compare with the baseline
        run: python scripts/ci_run.py

      - name: Show the summary on the run page
        if: always()
        run: |
          if [ -f reports/ci/summary.md ]; then
            cat reports/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-report
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 30

      - name: Post the summary on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # pull requests from forks can't write comments; don't fail for that
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'reports/ci/summary.md';
            if (!fs.existsSync(file)) {
              core.warning('No summary was written, so there is nothing to post.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync(file, 'utf8') +
              `\n[Open this workflow run](${runUrl}) and download the **scenario-report** artifact for the full HTML report.\n`;
            const marker = '<!-- wa-agent-test-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
