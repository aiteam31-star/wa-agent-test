[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wa-agent-test"
version = "0.1.0"
description = "Testing harness for AI agents running on the WhatsApp Cloud API: webhook simulator, mock Graph API, scenario runner, assertions, regression diffing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["whatsapp", "cloud-api", "testing", "ai-agents", "llm", "evaluation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
judges = ["wa-agent-test[anthropic,openai]"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "types-PyYAML",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
wa-agent-test = "wa_agent_test.cli:app"

# Third-party extension points (judges, truth sources, assertions).
[project.entry-points."wa_agent_test.judges"]
# anthropic = "wa_agent_test.judges.anthropic:AnthropicJudge"
# openai = "wa_agent_test.judges.openai:OpenAIJudge"

[project.entry-points."wa_agent_test.truth_sources"]
# file = "wa_agent_test.truth.file:FileTruthSource"
# http = "wa_agent_test.truth.http:HttpTruthSource"

[tool.hatch.build.targets.wheel]
packages = ["src/wa_agent_test"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]  # lets tests import the demo_bot package at the repo root
addopts = "-ra --strict-markers"
markers = [
  "integration: spins up local servers (mock Graph API / sample bot)",
  "llm: needs a real LLM provider key; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "demo_bot"]

[tool.coverage.run]
source = ["wa_agent_test"]
branch = true
