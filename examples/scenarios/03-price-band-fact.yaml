name: "price-band-fact: {{ ipo }}"
description: The upper price band the bot states matches the data, for every IPO.
tags: [ipo, facts]

for_each:
  ipo: ["Nova Textiles", "Bharat GreenGrid", "Kaveri Agro", "Sahyadri Fintech", "Marwar Cement"]

turns:
  - say: "What is the price band of {{ ipo }}?"
    expect:
      - fact:
          source: ipos
          entity: "{{ ipo }}"
          field: price_band_high
          extract:
            # Finds a rupee range such as "₹210-221", "₹96 - ₹101" or "₹ 455 to ₹ 478"; the
            # captured number is the upper end.
            regex: '₹\s*\d[\d,]*\s*(?:-|–|to)\s*(?:₹\s*)?(\d[\d,]*)'
            parser: number
