name: unknown-ipo-not-invented
description: For a company the bot doesn't know, it must not make up prices or lot sizes.
tags: [ipo, honesty]

turns:
  - say: "Tell me about Acme Industries IPO"
    expect:
      # generic help text may mention "price bands"; invented figures and dates must not appear
      - not_contains: ["₹", "listing date is", "lot size of", "closes on"]
