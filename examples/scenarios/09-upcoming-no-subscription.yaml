name: upcoming-ipo-no-subscription
description: An IPO that hasn't opened has no subscription data; the bot must say so, not invent numbers.
tags: [ipo, facts, honesty]

turns:
  - say: "What is the subscription status of Kaveri Agro?"
    expect:
      - not_contains: ["QIB", "retail", "overall"]
      - fact:
          source: ipos
          entity: "Kaveri Agro"
          field: open_date
          extract:
            # "opens on 2 December 2026" or "a proposed opening date of 2 December 2026"
            regex: '(?i)open\w*\D{0,30}?(\d{1,2}(?:st|nd|rd|th)? [A-Za-z]+ \d{4}|[A-Za-z]+ \d{1,2}(?:st|nd|rd|th)?, \d{4})'
            parser: date
