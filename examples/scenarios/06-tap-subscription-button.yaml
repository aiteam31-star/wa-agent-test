name: tap-subscription-button
description: Tap the Subscription button; the numbers must match the data and be given in times (x), not percent.
tags: [ipo, buttons, facts]

turns:
  - say: "Tell me about Nova Textiles"

  - tap_button: "Subscription"
    expect:
      - contains: ["QIB", "retail"]
      # Subscription is "times subscribed" (7.1x). A percent sign means the bot got the unit wrong.
      - not_contains: "%"
        why: "subscription must be given in times (like 7.1x), not percent"
      - fact:
          source: ipos
          entity: "Nova Textiles"
          field: subscription_total
          extract:
            # "overall 7.1x" or "Total: 7.1%": takes the number, the unit is checked above
            regex: '(?i)(?:overall|total)\D{0,20}?(\d+(?:\.\d+)?)'
            parser: number
      - fact:
          source: ipos
          entity: "Nova Textiles"
          field: subscription_retail
          extract:
            regex: '(?i)retail\D{0,20}?(\d+(?:\.\d+)?)'
            parser: number
