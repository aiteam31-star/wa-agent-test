name: tap-dates-button
description: Ask about an IPO, then tap the Dates button the bot offered; the dates must be right.
tags: [ipo, buttons, facts]

turns:
  - say: "Tell me about Nova Textiles"
    expect:
      - button_titles: ["Dates", "Price band", "Subscription"]

  - tap_button: "Dates"
    expect:
      - fact:
          source: ipos
          entity: "Nova Textiles"
          field: listing_date
          extract:
            regex: '(?i)list\w*\D{0,30}?(\d{1,2}(?:st|nd|rd|th)? [A-Za-z]+ \d{4}|[A-Za-z]+ \d{1,2}(?:st|nd|rd|th)?, \d{4})'
            parser: date
      - fact:
          source: ipos
          entity: "Nova Textiles"
          field: close_date
          extract:
            regex: '(?i)clos\w*\D{0,30}?(\d{1,2}(?:st|nd|rd|th)? [A-Za-z]+ \d{4}|[A-Za-z]+ \d{1,2}(?:st|nd|rd|th)?, \d{4})'
            parser: date
