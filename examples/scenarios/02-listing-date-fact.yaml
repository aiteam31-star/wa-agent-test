name: "listing-date-fact: {{ ipo }}"
description: The listing date the bot states matches the data, for every IPO.
tags: [ipo, facts]

for_each:
  ipo: ["Nova Textiles", "Bharat GreenGrid", "Kaveri Agro", "Sahyadri Fintech", "Marwar Cement"]

turns:
  - say: "When does {{ ipo }} list?"
    expect:
      - fact:
          source: ipos
          entity: "{{ ipo }}"
          field: listing_date
          extract:
            # Finds "listing date is 30 November 2026", "listed on NSE & BSE from 30th November
            # 2026" or "Listing: November 30, 2026". Looks within 30 characters after the word
            # "list..." so the open/close dates in a longer answer aren't picked up by mistake.
            regex: '(?i)list\w*\D{0,30}?(\d{1,2}(?:st|nd|rd|th)? [A-Za-z]+ \d{4}|[A-Za-z]+ \d{1,2}(?:st|nd|rd|th)?, \d{4})'
            parser: date
