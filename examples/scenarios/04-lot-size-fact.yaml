name: lot-size-fact
description: The lot size the bot states matches the data.
tags: [ipo, facts]

turns:
  - say: "What is the lot size for Nova Textiles?"
    expect:
      - fact:
          source: ipos
          entity: "Nova Textiles"
          field: lot_size
          extract:
            # "lot size 67 shares", "The lot size for Nova Textiles is 67."
            regex: '(?i)lot size\D{0,30}?(\d[\d,]*)'
            parser: number
